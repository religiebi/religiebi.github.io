<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branches of Faith — how the Abrahamic religions branched</title>
    <meta
      name="description"
      content="An interactive timeline of how Judaism, Christianity, Islam and the Bahá'í Faith branched over 2,500 years: when each split happened, why, and what changed. Neutral summaries with sources."
    />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://religiebi.github.io/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Branches of Faith" />
    <meta property="og:title" content="Branches of Faith" />
    <meta
      property="og:description"
      content="Interactive timeline of how the Abrahamic religions branched: when, why, and what changed."
    />
    <meta property="og:url" content="https://religiebi.github.io/" />
    <meta property="og:image" content="https://religiebi.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Branches of Faith" />
    <meta
      name="twitter:description"
      content="Interactive timeline of how the Abrahamic religions branched: when, why, and what changed."
    />
    <meta name="twitter:image" content="https://religiebi.github.io/og-image.png" />

    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var mode = 'system';
        try {
          mode = localStorage.getItem('bof-theme') || 'system';
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1rem; font-family: sans-serif">
        Branches of Faith is an interactive chart and needs JavaScript.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
